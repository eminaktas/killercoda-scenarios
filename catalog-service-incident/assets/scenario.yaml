apiVersion: crd.projectcalico.org/v1
kind: IPPool
metadata:
  name: platform-ipv4-pool
spec:
  allowedUses:
    - Workload
    - Tunnel
  blockSize: 26
  cidr: 10.245.0.0/16
  ipipMode: Always
  natOutgoing: true
  nodeSelector: all()
  vxlanMode: Never
---
apiVersion: v1
kind: Namespace
metadata:
  name: storefront
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: storefront
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      nodeSelector:
        kubernetes.io/hostname: storefront-lab-worker
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: storefront
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: storefront
  labels:
    app: frontend
spec:
  nodeSelector:
    kubernetes.io/hostname: storefront-lab-control-plane
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: curl
      image: curlimages/curl:8.12.1
      command: ["sleep", "1d"]
---
apiVersion: v1
kind: Pod
metadata:
  name: reporting
  namespace: storefront
  labels:
    app: reporting
spec:
  nodeSelector:
    kubernetes.io/hostname: storefront-lab-control-plane
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: curl
      image: curlimages/curl:8.12.1
      command: ["sleep", "1d"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-catalog
  namespace: storefront
spec:
  podSelector:
    matchLabels:
      app: catalog
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 80
